aid: kouper-health
name: Kouper Health
description: 'Kouper Health (Kouper) is a healthcare technology company building an AI-agent orchestration
  layer for care navigation, deployed on top of a provider organization''s existing EHR. The platform
  spans the full patient journey through three named agents: PRIMUS for patient access and inbound
  coordination (appointment scheduling, intake, insurance verification, missed-call recovery), ARCHIE
  for inpatient and post-acute navigation (discharge planning, home health attachment, LUPA risk),
  and CURA for ongoing care coordination and management (proactive outreach, reminders, check-ins,
  escalation). Kouper sells to health systems, independent and specialty provider groups, clinically
  integrated networks, risk-bearing entities, and payers, with multilingual patient engagement,
  human escalation, and HIPAA-compliant workflows. The company emerged from stealth in May 2025 with
  a $10M seed round led by General Catalyst with 25Madison and CVS Health Ventures, and operates out
  of New York, San Francisco, and Nashville. As of this profile Kouper publishes no public developer
  portal, API documentation, API reference, or machine-readable API artifacts — the product is
  delivered as a managed EHR-integrated service rather than a self-serve API.'
